heat_template_version: wallaby
description: "imple Base HOT for Sample VNF"

parameters:
  nfv:
    type: json
  security_group:
    type: string
    default: default
  api_params:
    type: json

resources:
  internalVL1:
    type: OS::Neutron::Net

  internalVL1_subnet:
    type: OS::Neutron::Subnet
    depends_on: [internalVL1]
    properties:
      ip_version: 4
      network:
        get_resource: internalVL1
      cidr: 192.168.0.0/24

  VDU1_scale_group:
    type: OS::Heat::AutoScalingGroup
    properties:
      min_size: 1
      max_size: 3
      desired_capacity: { get_param: [nfv, VDU, VDU1, desired_capacity] }
      resource:
        type: VDU1.yaml
        properties:
          flavor: { get_param: [nfv, VDU, VDU1, computeFlavourId] }
          image: { get_param: [nfv, VDU, VDU1, vcImageId] }
          zone: { get_param: [nfv, VDU, VDU1, locationConstraints] }
          net1: { get_resource: internalVL1 }
          net2: { get_param: [nfv, CP, VDU1_CP1, network] }
          # subnet1: { get_param: [nfv, CP, VDU1_CP0, fixed_ips, 0, subnet ]}
          subnet2: { get_param: [nfv, CP, VDU1_CP1, fixed_ips, 0, subnet] }
          ip_address:
            { get_param: [nfv, CP, VDU1_CP1, fixed_ips, 0, ip_address] }
          security_group: { get_param: security_group }

outputs:

  # this return a mapping map like this  {stack_id_1: private_ip_1, stack_id_2: private_ip_2, ...}
  test0:
    description: "test0"
    value: { get_attr: [VDU1_scale_group, outputs, vdu1_private_ip] }

  # These 2 fail, I dont know why
  # test1:
  #   description: "Test1"
  #   value: { get_attr: [VDU1_scale_group, outputs] }
  # test2:
  #   description: "Test2"
  #   value: { get_attr: [VDU1_scale_group, outputs_list] }

  # This return a list of private IPs like this [private_ip_1, private_ip_2, ...]
  test5:
    description: "Test5"
    value: { get_attr: [VDU1_scale_group, outputs_list, vdu1_private_ip] }  
 
  # Please do not use this
  # test6:
  #   description: "Test6"
  #   value: { get_attr: [VDU1_scale_group] }