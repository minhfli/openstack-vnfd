parameters:
  nfv:
    VDU:
      VDU1:
        image: suricata-base
        #flavor: m1.mini # 1 vCPU, 1 GB RAM, 6 GB disk
        flavor: m1.mini512 # 1 vCPU, 512 MB RAM, 6 GB disk
        desired_capacity: 3 # start at 1
    CP:
      VDU1_CP0:
      VDU1_CP1:
        network: private
        fixed_ips:
          - subnet: private-subnet

  api_params: {}

  security_group: test-secgr # TCP, ICMP, SSH, HTTP, HTTPS

  key_name: minh # ssh key, change this to yours

  # remove / comment this to enable auto-scaling
  enable_auto_scaling: false

  # remove / comment this to enable auto-healing
  enable_auto_healing: false

  cpu_threshold_high: 210000000000.0
  #                   210         .
  #                      000      .
  #                         000   .
  #                            000.

  cpu_threshold_low: 90000000000.0
  #                  90         .
  #                    000      .
  #                       000   .
  #                          000.

  # Example with 1 vCPUs and granularity of 300 seconds:
  # Threshold = Percentage_in_Decimal * 1 * 1,000,000,000 * 300
  # 1   * 1 * 1 000 000 000 * 300 = 300 000 000 000
  # 0.9 * 1 * 1000000000 * 300 = 270000000000.0
  # 0.8 * 1 * 1000000000 * 300 = 240000000000.0
  # 0.7 * 1 * 1000000000 * 300 = 210000000000.0
  # 0.6 * 1 * 1000000000 * 300 = 180000000000.0 
  # 0.5 * 1 * 1000000000 * 300 = 150000000000.0
  # 0.4 * 1 * 1000000000 * 300 = 120000000000.0
  # 0.3 * 1 * 1000000000 * 300 = 90000000000.0
  # 0.2 * 1 * 1000000000 * 300 = 60000000000.0
  # 0.1 * 1 * 1000000000 * 300 = 30000000000.0