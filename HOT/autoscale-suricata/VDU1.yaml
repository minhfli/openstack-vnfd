heat_template_version: wallaby
description: "VDU1 HOT template"

parameters:
  flavor:
    type: string
    default: m1.mini
  image:
    type: string
    default: jammy-base

  net1:
    type: string
    default: private
  subnet1:
    type: string
    default: private-subnet
  lb_pool:
    type: string

  security_group:
    type: string
    default: test-secgr
  key_name:
    type: string
    default: minh
  metadata:
    type: json
    default: {}
  root_stack_id:
    type: string
    default: ""

conditions:
  is_standalone: { equals: [{ get_param: root_stack_id }, ""] }

resources:
  VDU1:
    type: OS::Nova::Server
    depends_on: [VDU1_CP1, number]
    properties:
      flavor: { get_param: flavor }
      name:
        str_replace:
          template: VDU1-$last
          params:
            $last: { get_attr: [number, value, 3] }
      # image: { get_param: image } # remmember to delete volumes attached to the instance
      key_name: { get_param: key_name }
      metadata: { get_param: metadata }
      block_device_mapping:
        - delete_on_termination: true
          device_name: vda
          snapshot_id: { get_param: image }
      networks:
        - port:
            get_resource: VDU1_CP1
      user_data_format: RAW
      user_data: # wait 10-15 minutes (after created) for the server to be ready, sometimes it even takes > 1 hour
        str_replace:
          template: |
            #!/bin/bash

            notify_url="${$wc_notify//0.0.0.0/192.168.1.1} --data-binary '{\"status\": \"SUCCESS\"}'"

            echo "$notify_url"
            echo "$notify_url" > /var/www/html/wc_notify.txt

            echo "IP: $cp1 ----- Floating: $fip" > /var/www/html/index.html 
            systemctl restart apache2 

            # sleep to stablize cpu usage
            sleep 60
            $notify_url 
            echo "USER DATA SETUP COMPLETED"
            exit 0
          params:
            $cp1: { get_attr: [VDU1_CP1, fixed_ips, 0, ip_address] }
            $fip: { get_attr: [VDU1_floatingIP, floating_ip_address] }
            $wc_notify: { get_attr: [wait_handle, curl_cli] }
      # availability_zone: { get_param: zone }

  wait_for_instance: # wait for instance to be ready, stack will stay in IN_PROGRESS state until the instance done executing user_data
    type: OS::Heat::WaitCondition
    properties:
      handle: { get_resource: wait_handle }
      count: 1
      timeout: 3600

  wait_handle:
    type: OS::Heat::WaitConditionHandle

  number:
    type: OS::Heat::Value
    properties:
      value:
        str_split: [".", { get_attr: [VDU1_floatingIP, floating_ip_address] }]

  # extVL with numDynamicAddresses and subnet
  VDU1_CP1:
    type: OS::Neutron::Port
    properties:
      network: { get_param: net1 }
      fixed_ips:
        - subnet: { get_param: subnet1 }
      security_groups: [{ get_param: security_group }]

  LB_member:
    type: OS::Octavia::PoolMember
    properties:
      pool: { get_param: lb_pool }
      address: { get_attr: [VDU1_CP1, fixed_ips, 0, ip_address] }
      protocol_port: 80
      subnet: { get_param: subnet1 }

  # Floating IP, remove this when deploying in a public cloud
  VDU1_floatingIP:
    type: OS::Neutron::FloatingIP
    properties:
      floating_network: public
      port_id: { get_resource: VDU1_CP1 }

outputs:
  lb_member:
    description: LB member details.
    value: { get_attr: [LB_member, show] }
  instance_id:
    description: "ID of VDU1"
    value: { get_resource: VDU1 }
  vdu1_private_ip:
    description: "Public IP of VDU1"
    value: { get_attr: [VDU1_CP1, fixed_ips, 0, ip_address] }
  vdu1_floating_ip:
    description: "Floating IP of VDU1"
    value: { get_attr: [VDU1_floatingIP, floating_ip_address] }
