heat_template_version: wallaby
description: >
  origin: https://github.com/openstack/heat-templates/blob/master/hot/autohealing/autohealing_server.yaml
  
  A stack containing a server that is automatically replaced if it is stopped,
  deleted, or goes into an error state, using an Aodh alarm delivered to a
  Zaqar queue that triggers a Mistral workflow. This may be either be used
  standalone, or as the scaled unit of a scaling group. When using this from
  inside another template, the 'root_stack_id' parameter should be passed to
  indicate at which stack the stack update should commence after marking the
  server as failed. This should be the root-level stack, to ensure that any
  other resources depending on outputs from this stack are also updated. Note
  that this requires event alarms to be enabled in Aodh, following the
  instructions at
  https://docs.openstack.org/aodh/latest/contributor/event-alarm.html#configuration
  (specifically, by adding the publisher "notifier://?topic=alarm.all" in
  /etc/ceilometer/event_pipeline.yaml).

parameters:
  flavor:
    type: string
    default: m1.mini
  image:
    type: string
    default: jammy-base
  # zone:
  #   type: string
  net1:
    type: string
    default: ""
  net2:
    type: string
    default: private
  # subnet1:
  #   type: string
  subnet2:
    type: string
    default: private-subnet
  security_group:
    type: string
    default: test-secgr
  key_name:
    type: string
    default: minh
  metadata:
    type: json
    default: {}
  root_stack_id:
    type: string
    default: ""
  enable_auto_healing:
    type: boolean
    default: true

conditions:
  is_standalone: {equals: [{get_param: root_stack_id}, ""]}

resources:
  VDU1:
    type: OS::Nova::Server
    depends_on: [VDU1_CP0, VDU1_CP1, number]
    properties:
      flavor: { get_param: flavor }
      name:
        str_replace:
          template: VDU1-$last
          params:
            $last: { get_attr: [number, value, 3] }    
      image: { get_param: image }
      key_name: { get_param: key_name }
      metadata: { get_param: metadata }
      networks:
        - port:
            get_resource: VDU1_CP0
        - port:
            get_resource: VDU1_CP1
      user_data_format: RAW
      user_data: # wait 5-10 minutes (after boot) for the server to be ready, if not, the server will return default apache2 page
        str_replace: 
          template: |
            #!/bin/bash
            echo "IP: $cp1 \n Floating: $fip" > /var/www/html/index.html &&
            systemctl restart apache2 &&
            exit 0
          params:
            $cp1: { get_attr: [VDU1_CP1, fixed_ips, 0, ip_address] }
            $fip: { get_attr: [VDU1_floatingIP, floating_ip_address] }
      # availability_zone: { get_param: zone }
  
  number:
    type: OS::Heat::Value
    depends_on: [VDU1_CP1]
    properties:
      value:
        # 192.168.xxx.yyy => [192,168,xxx,yyy]
        str_split: ['.', { get_attr: [VDU1_CP1, fixed_ips, 0, ip_address] }]

  # internal VL connection, you can remove this if not needed
  VDU1_CP0:
    type: OS::Neutron::Port
    properties:
      network: { get_param: net1 }
      security_groups: [{ get_param: security_group }]

  # extVL with numDynamicAddresses and subnet
  VDU1_CP1:
    type: OS::Neutron::Port
    properties:
      network: { get_param: net2 }
      fixed_ips:
        - subnet: { get_param: subnet2 }
      # - ip_address: { get_param: ip_address }
      security_groups: [{ get_param: security_group }]
  
  # Floating IP, remove this when deploying in a public cloud
  VDU1_floatingIP:
    type: OS::Neutron::FloatingIP
    properties:
      floating_network: public
      port_id: { get_resource: VDU1_CP1 }

  # Autohealing resources
  alarm_queue:
    type: OS::Zaqar::Queue

  stop_event_alarm:
    type: OS::Aodh::EventAlarm
    properties:
      event_type: compute.instance.power_off.*
      query:
        - field: traits.instance_id
          value: {get_resource: VDU1}
          op: eq
        # - field: traits.state
        #   value: shutoff
        #   op: eq
      alarm_queues:
       - {get_resource: alarm_queue}
      enabled: {get_param: enable_auto_healing}

  error_event_alarm:
    type: OS::Aodh::EventAlarm
    properties:
      event_type: compute.instance.update
      query:
        - field: traits.instance_id
          value: {get_resource: VDU1}
          op: eq
        - field: traits.state
          value: error
          op: eq
      alarm_queues:
       - {get_resource: alarm_queue}
      enabled: {get_param: enable_auto_healing}

  deleted_event_alarm:
    type: OS::Aodh::EventAlarm
    properties:
      event_type: compute.instance.delete.start
      query:
        - field: traits.instance_id
          value: {get_resource: VDU1}
          op: eq
      alarm_queues:
       - {get_resource: alarm_queue}
      enabled: {get_param: enable_auto_healing}

  # The Aodh event alarm does not take effect immediately; it may take up to
  # 60s (by default) for the event_alarm_cache_ttl to expire and the tenant's
  # alarm data to be loaded. This resource ensures the stack is not completed
  # until the alarm is active. See https://bugs.launchpad.net/aodh/+bug/1651273
  alarm_cache_wait:
    type: OS::Heat::TestResource
    properties:
      action_wait_secs:
        create: 60
        update: 60
      value:
        list_join:
          - ''
          - - {get_attr: [stop_event_alarm, show]}
            - {get_attr: [error_event_alarm, show]}
            - {get_attr: [deleted_event_alarm, show]}

  alarm_subscription:
    type: OS::Zaqar::MistralTrigger
    properties:
      queue_name: {get_resource: alarm_queue}
      workflow_id: {get_resource: autoheal}
      input:
        stack_id: {get_param: "OS::stack_id"}
        root_stack_id:
          if:
            - is_standalone
            - {get_param: "OS::stack_id"}
            - {get_param: "root_stack_id"}

  autoheal:
    type: OS::Mistral::Workflow
    properties:
      description: >
        Mark a server as unhealthy and commence a stack update to replace it.
      input:
        stack_id:
        root_stack_id:
      type: direct
      tasks:
        - name: resources_mark_unhealthy
          action:
            list_join:
              - ' '
              - - heat.resources_mark_unhealthy
                - stack_id=<% $.stack_id %>
                - resource_name=<% env().notification.body.reason_data.event.traits.where($[0] = 'instance_id').select($[2]).first() %>
                - mark_unhealthy=true
                - resource_status_reason='Marked by alarm'
          on_success:
            - stacks_update
        - name: stacks_update
          action: heat.stacks_update stack_id=<% $.root_stack_id %> existing=true

outputs:
  vdu1_internal_ip:
    description: "Private IP of VDU1"
    value: { get_attr: [VDU1_CP0, fixed_ips, 0, ip_address] }
  vdu1_external_ip:
    description: "Public IP of VDU1"
    value: { get_attr: [VDU1_CP1, fixed_ips, 0, ip_address] }
  vdu1_floating_ip:
    description: "Floating IP of VDU1"
    value: { get_attr: [VDU1_floatingIP, floating_ip_address] }