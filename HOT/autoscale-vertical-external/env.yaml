parameters: # many were changed for compatibility with tacker params.json
  nfv:
    VDU:
      VDU1:
        vcImageId: b6687f04-eca2-4fa5-b5fa-fc1c0eee90bd # volume snapshot
        key_name: minh
    CP:
      VDU1_CP1:
        network: heat-net
        fixed_ips:
          - subnet: heat-subnet
        security_group: test-secgr

  VDU1-scaling:
    enable_autoscale: true
    alarm_post_url: http://0.0.0.0:8080 # for alarm notification
    scale-levels:
      - cpu_threshold_hi: 210000000000.0
        cpu_threshold_lo: 90000000000.0
        ram: 512
        vcpu: 1
      - cpu_threshold_hi: 420000000000.0
        cpu_threshold_lo: 180000000000.0
        ram: 768
        vcpu: 2
      - cpu_threshold_hi: 630000000000.0
        cpu_threshold_lo: 270000000000.0
        ram: 768
        vcpu: 3
      - cpu_threshold_hi: 840000000000.0
        cpu_threshold_lo: 360000000000.0
        ram: 1024
        vcpu: 4

  VDU1-scale-level: 0 # default scale level, just for fastest boot
