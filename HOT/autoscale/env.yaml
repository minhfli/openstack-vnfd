parameters:
  nfv:
    VDU:
      VDU1:
        image: jammy-base
        #flavor: m1.mini # 1 vCPU, 1 GB RAM, 6 GB disk
        flavor: m1.mini512 # 1 vCPU, 512 MB RAM, 6 GB disk
        desired_capacity: 3 # start at 1
    CP:
      VDU1_CP0:
      VDU1_CP1:
        network: private
        fixed_ips:
          - subnet: private-subnet
  # nfv:
  #   VDU:
  #     VDU1:
  #       image: cirros-0.3.5-x86_64-disk
  #       flavor: m1.tiny # 1 vCPU, 512 MB RAM, 1 GB disk
  #       desired_capacity: 2 # start at 2
  #   CP:
  #     VDU1_CP0:
  #     VDU1_CP1:
  #       network: private
  #       fixed_ips:
  #         - subnet: private-subnet

  api_params: {}

  security_group: test-secgr # TCP, ICMP, SSH, HTTP, HTTPS

  key_name: minh # ssh key, change this to yours

  # remove / comment this to enable auto-scaling
  enable_auto_scaling: false

  # remove / comment this to enable auto-healing
  enable_auto_healing: true

  # Example with 2 vCPUs and granularity of 300 seconds:
  # Threshold = Percentage_in_Decimal * 2 * 1,000,000,000 * 300
  # 1   * 2 * 1000000000 * 300 = 600000000000
  # 0.9 * 2 * 1000000000 * 300 = 540000000000.0
  # 0.8 * 2 * 1000000000 * 300 = 480000000000.0
  # 0.7 * 2 * 1000000000 * 300 = 420000000000.0
  # 0.6 * 2 * 1000000000 * 300 = 360000000000.0
  # 0.5 * 2 * 1000000000 * 300 = 300000000000.0
  # 0.4 * 2 * 1000000000 * 300 = 240000000000.0
  # 0.3 * 2 * 1000000000 * 300 = 180000000000.0
  # 0.2 * 2 * 1000000000 * 300 = 120000000000.0
  # 0.1 * 2 * 1000000000 * 300 =  60000000000.0